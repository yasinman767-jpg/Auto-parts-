name: Build Android Release

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extracted/react-native-app/package-lock.json

      - name: Install dependencies
        working-directory: extracted/react-native-app
        run: npm ci

      - name: Generate bundle assets
        working-directory: extracted/react-native-app
        run: |
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Build APK and AAB
        working-directory: extracted/react-native-app/android
        env:
          ORG_GRADLE_PROJECT_MYAPP_RELEASE_STORE_FILE: ${{ github.workspace }}/android/debug.keystore
          ORG_GRADLE_PROJECT_MYAPP_RELEASE_STORE_PASSWORD: android
          ORG_GRADLE_PROJECT_MYAPP_RELEASE_KEY_ALIAS: androiddebugkey
          ORG_GRADLE_PROJECT_MYAPP_RELEASE_KEY_PASSWORD: android
        run: |
          keytool -genkeypair -v -storetype PKCS12 -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          ./gradlew assembleRelease bundleRelease

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            extracted/react-native-app/android/app/build/outputs/apk/release/app-release.apk
            extracted/react-native-app/android/app/build/outputs/bundle/release/app-release.aab
          tag_name: release-${{ github.run_number }}
          draft: false
          prerelease: false
